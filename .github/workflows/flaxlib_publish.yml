name: Flaxlib - Build and upload to PyPI

# for testing only:
on:
  push:
    branches: [main]
    paths: ['flaxlib/**']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheels:
    if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'flaxlib/')
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1

    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==2.21.0

    - name: Build wheels
      run: python -m cibuildwheel --output-dir ./flaxlib/wheelhouse ./flaxlib
      env:
        # rust doesn't seem to be available for musl linux on i686
        CIBW_SKIP: "*-musllinux_i686"
        CIBW_ENVIRONMENT: 'PATH="$HOME/.cargo/bin:$PATH" CARGO_TERM_COLOR="always"'
        CIBW_ENVIRONMENT_WINDOWS: 'PATH="$UserProfile\.cargo\bin;$PATH"'
        CIBW_BEFORE_BUILD: rustup show
        CIBW_BEFORE_BUILD_LINUX: |
          curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain=stable --profile=minimal -y &&
          rustup show

    - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: ./flaxlib/wheelhouse/*.whl

  build_sdist:
    if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'flaxlib/')
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1

    - name: Build sdist
      run: pipx run build --sdist flaxlib

    - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: cibw-sdist
        path: ./flaxlib/dist/*.tar.gz

  upload_pypi:
    if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'flaxlib/')
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools build wheel twine
    - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        # unpacks all CIBW artifacts into dist/
        pattern: cibw-*
        path: ./flaxlib/dist
        merge-multiple: true

    - name: Authenticate to Google Cloud (OSS Exit Gate)
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    - name: Clean up failed staging attempt for this exact version (if any)
      run: |
        python3 - <<'PY'
        import email, glob, re, subprocess, tarfile, zipfile
        seen = set()
        for f in sorted(glob.glob("dist/**/*.whl", recursive=True) + glob.glob("dist/**/*.tar.gz", recursive=True)):
          try:
            if f.endswith(".whl"):
              with zipfile.ZipFile(f) as zf:
                meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
                msg = email.message_from_bytes(zf.read(meta))
            else:
              with tarfile.open(f) as tf:
                info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
                msg = email.message_from_bytes(tf.extractfile(info).read())
            pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
            ver = msg["Version"].strip()
          except Exception:
            continue
          if (pkg, ver) in seen:
            continue
          seen.add((pkg, ver))
          if subprocess.run([
              "gcloud", "artifacts", "versions", "describe", ver,
              f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=flax--pypi"
          ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
            subprocess.run([
                "gcloud", "artifacts", "versions", "delete", ver,
                f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=flax--pypi", "--quiet"
            ], check=False)
        PY

    - name: Build and publish via OSS Exit Gate
      run: |
        python -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/flax--pypi/" \
          -u oauth2accesstoken \
          -p "$(gcloud auth print-access-token)" \
          flaxlib/dist/*
        echo '{"publish_all": true}' > manifest.json
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/flax/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"